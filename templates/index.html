<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineJoy • Chat + Live Avatar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    .nice-scrollbar::-webkit-scrollbar { width: 10px; }
    .nice-scrollbar::-webkit-scrollbar-thumb { background: #c7c7e6; border-radius: 9999px; }
    .nice-scrollbar { scrollbar-width: thin; scrollbar-color: #c7c7e6 transparent; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center p-4">
<div class="w-full max-w-6xl bg-white rounded-2xl shadow-2xl overflow-hidden">
  <!-- Header -->
  <div class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-6">
    <h1 class="text-3xl font-light">🎬 CineJoy</h1>
    <p class="opacity-90">Character Chat POC — chat on the left, live avatar on the right</p>
  </div>

  <!-- Main content -->
  <div class="grid md:grid-cols-2 gap-0">
    <!-- Chat Pane -->
    <div class="p-6">
      <div class="bg-white rounded-2xl border shadow-sm flex flex-col h-[640px]">
        <div class="px-6 py-4 border-b">
          <h3 class="text-lg font-semibold">💬 Chat with Michael Corleone</h3>
          <p class="text-sm text-gray-500">Ask me anything about the movie or my experiences</p>
        </div>

        <div id="chatMessages" class="flex-1 p-4 bg-gray-50 nice-scrollbar overflow-y-auto space-y-3">
          <div class="flex items-start gap-2">

          </div>
        </div>

        <div class="p-4 border-t">
         <form id="chatForm" class="flex gap-2">
          <input id="messageInput" type="text" placeholder="Type your message here..." class="flex-1 px-4 py-3 rounded-full border focus:outline-none focus:ring-2 focus:ring-indigo-400" required />

          <!-- Mic Button -->
          <button type="button" id="micButton" class="px-3 py-3 rounded-full bg-gray-200 hover:bg-gray-300 transition relative overflow-hidden">
            <span id="micIcon">🎤</span>
            <span id="recordingDots" class="absolute inset-0 flex items-center justify-center space-x-1 opacity-0">
              <span class="w-2 h-2 bg-red-500 rounded-full animate-ping"></span>
              <span class="w-2 h-2 bg-red-500 rounded-full animate-ping animation-delay-200"></span>
              <span class="w-2 h-2 bg-red-500 rounded-full animate-ping animation-delay-400"></span>
            </span>
          </button>

          <button id="sendButton" type="submit" class="px-5 py-3 rounded-full text-white bg-gradient-to-r from-indigo-500 to-purple-600 hover:brightness-110 transition disabled:opacity-60 disabled:cursor-not-allowed">
            <span id="buttonText">Send</span>
            <span id="loadingSpinner" class="hidden w-5 h-5 border-2 border-gray-200 border-t-indigo-500 rounded-full animate-spin"></span>
          </button>
        </form>


          <div id="typingIndicator" class="hidden mt-2 text-sm text-gray-500 italic flex items-center gap-2">
            <span class="w-5 h-5 border-2 border-gray-200 border-t-indigo-500 rounded-full animate-spin"></span>
            <span>Michael is typing…</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Live Avatar Pane -->
    <div class="p-6 border-l bg-white">
      <div class="rounded-2xl border shadow-sm p-4">
        <h3 class="text-lg font-semibold mb-3">🧑‍🚀 Live Avatar</h3>
        <video id="mediaElement" class="w-full max-h-[360px] border rounded-lg" autoplay></video>
        <div id="status" class="mt-3 p-2 h-[120px] text-xs font-mono overflow-y-auto border rounded nice-scrollbar bg-gray-50"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ----------------- CHAT -----------------
const chatForm = document.getElementById('chatForm');
const messageInput = document.getElementById('messageInput');
const chatMessages = document.getElementById('chatMessages');
const sendButton = document.getElementById('sendButton');
const buttonText = document.getElementById('buttonText');
const loadingSpinner = document.getElementById('loadingSpinner');
const typingIndicator = document.getElementById('typingIndicator');
const OPENING_TEXT = "Hello! I'm Michael Corleone. I'm here to share my story and experiences. What would you like to know about me or the events that took place during the war?";


function addMessage(content, sender) {
  const wrapper = document.createElement('div');
  wrapper.className = sender === 'user' ? 'flex items-start gap-2 justify-end' : 'flex items-start gap-2';
  const avatar = document.createElement('div');
  avatar.className = 'w-9 h-9 rounded-full grid place-items-center font-semibold ' +
                     (sender === 'user' ? 'bg-purple-600 text-white' : 'bg-rose-500 text-white');
  avatar.textContent = sender === 'user' ? 'U' : 'MC';
  const bubble = document.createElement('div');
  bubble.className = 'max-w-[75%] p-3 rounded-2xl ' +
                     (sender === 'user' ? 'bg-indigo-500 text-white rounded-tr-sm' : 'bg-white border text-gray-800 rounded-tl-sm');
  bubble.textContent = content;
  if (sender === 'user') { wrapper.appendChild(bubble); wrapper.appendChild(avatar); }
  else { wrapper.appendChild(avatar); wrapper.appendChild(bubble); }
  chatMessages.appendChild(wrapper);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function setLoadingState(isLoading) {
  sendButton.disabled = isLoading;
  buttonText.classList.toggle('hidden', isLoading);
  loadingSpinner.classList.toggle('hidden', !isLoading);
  typingIndicator.classList.toggle('hidden', !isLoading);
}

// ----------------- AVATAR -----------------
const API_CONFIG = {
  apiKey: 'ZmE1MDhlZTNiNmZkNDlmMmEyZWViNTRiZjdiNTQxOWQtMTc1NTg1ODAxNA==',
  serverUrl: 'https://api.heygen.com',
};
const HARDCODED_AVATAR_ID = "Wayne_20240711";
const HARDCODED_VOICE_ID = "01209fdcd1c24a109c86dc24ee0f71c0";

let sessionInfo = null;
let room = null;
let mediaStream = null;
let sessionToken = null;
let avatarStarted = false;

const statusEl = document.getElementById('status');
const mediaEl = document.getElementById('mediaElement');

function logStatus(msg) {
  const t = new Date().toLocaleTimeString();
  statusEl.innerHTML += `[${t}] ${msg}<br>`;
  statusEl.scrollTop = statusEl.scrollHeight;
}

async function getSessionToken() {
  const res = await fetch(`${API_CONFIG.serverUrl}/v1/streaming.create_token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Api-Key': API_CONFIG.apiKey },
  });
  const data = await res.json();
  sessionToken = data?.data?.token;
  logStatus('Session token obtained');
}
async function waitForAvatarReady() {
  return new Promise((resolve) => {
    const checkReady = setInterval(() => {
      if (sessionInfo?.session_id && avatarStarted) {
        clearInterval(checkReady);
        resolve();
      }
    }, 200);
  });
}
async function createNewSession() {
  if (!sessionToken) await getSessionToken();

  const res = await fetch(`${API_CONFIG.serverUrl}/v1/streaming.new`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${sessionToken}` },
    body: JSON.stringify({
  quality: 'high',
  avatar_name: HARDCODED_AVATAR_ID,
  voice: { voice_id: HARDCODED_VOICE_ID, rate: 1.0 },
  version: 'v2',
  video_encoding: 'H264',
  manual: true,
  silence_response: true,
  disable_intro: true
})
,
  });
  const data = await res.json();
  sessionInfo = data?.data;

  room = new LivekitClient.Room({
    adaptiveStream: true,
    dynacast: true,
    videoCaptureDefaults: { resolution: LivekitClient.VideoPresets.h720.resolution },
  });

  mediaStream = new MediaStream();
  room.on(LivekitClient.RoomEvent.TrackSubscribed, track => {
    if (track.kind === 'video' || track.kind === 'audio') {
      mediaStream.addTrack(track.mediaStreamTrack);
      if (mediaStream.getVideoTracks().length && mediaStream.getAudioTracks().length) {
        mediaEl.srcObject = mediaStream;
        logStatus('Media stream ready');
      }
    }
  });
  room.on(LivekitClient.RoomEvent.Disconnected, reason => logStatus(`Room disconnected: ${reason}`));

  logStatus('Session created');
}

async function startStreamingSession() {
  if (!sessionInfo || !sessionToken) return;
  await fetch(`${API_CONFIG.serverUrl}/v1/streaming.start`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${sessionToken}` },
    body: JSON.stringify({ session_id: sessionInfo.session_id }),
  });
  await room.connect(sessionInfo.url, sessionInfo.access_token);
  logStatus('Connected to room');
  logStatus('Streaming started');
}

async function avatarSendText(text) {
  if (!avatarStarted) {
    await startStreamingSession();
    avatarStarted = true;
  }
  await fetch(`${API_CONFIG.serverUrl}/v1/streaming.task`, {
    method: 'POST',
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${sessionToken}` },
    body: JSON.stringify({ session_id: sessionInfo.session_id, text, task_type: "repeat" }),
  });
  logStatus(`Avatar speaking: ${text.substring(0,120)}${text.length>120?'…':''}`);
}

async function closeSession() {
  try {
    if (sessionInfo && sessionToken) {
      await fetch(`${API_CONFIG.serverUrl}/v1/streaming.stop`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${sessionToken}` },
        body: JSON.stringify({ session_id: sessionInfo.session_id }),
      });
    }
  } catch {}
  if (room) { try { room.disconnect(); } catch {} room = null; }
  mediaEl.srcObject = null;
  sessionInfo = null; mediaStream = null; sessionToken = null;
  avatarStarted = false;
  logStatus('Session closed');
}

// ----------------- INIT AVATAR -----------------
async function ensureAvatarStarted() {
  if (avatarStarted) return;
  await createNewSession();
  await startStreamingSession();
  avatarStarted = true;
    // ✅ Add opening text to chat
  addMessage(OPENING_TEXT, 'character');

  // ✅ Make avatar speak the opening text
  await avatarSendText(OPENING_TEXT);
}
document.addEventListener("click", ensureAvatarStarted, { once: true });
chatForm.addEventListener("submit", ensureAvatarStarted, { once: true });
window.addEventListener("beforeunload", closeSession);

// ----------------- CHAT SUBMIT -----------------
chatForm.addEventListener('submit', async e => {
  e.preventDefault();
  const message = messageInput.value.trim();
  if (!message) return;

  addMessage(message, 'user');
  messageInput.value = '';
  setLoadingState(true);

  try {
    // 1️⃣ Ensure avatar session is ready
    await ensureAvatarStarted();

    // 2️⃣ Send chat to backend
    const response = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ movie:'The-Godfather', character:'Michael Corleone', message, session_id:'demo-session-1' }),
    });
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    const data = await response.json();

    // 3️⃣ Add chat bubble and speak
    addMessage(data.reply, 'character');
    await waitForAvatarReady();
    await avatarSendText(data.reply);

  } catch (err) {
    console.error(err);
    addMessage('Sorry, I encountered an error. Please try again.', 'character');
  } finally { setLoadingState(false); }
});
// ----------------- VOICE TO TEXT -----------------
const micButton = document.getElementById('micButton');

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  micButton.addEventListener('click', () => {
    recognition.start();
    micButton.textContent = '🎙️…'; // listening indicator
  });

  recognition.addEventListener('result', (event) => {
    const speechResult = event.results[0][0].transcript;
    messageInput.value = speechResult;
  });

  recognition.addEventListener('end', () => {
    micButton.textContent = '🎤'; // reset mic icon
  });

  recognition.addEventListener('error', (event) => {
    console.error('Speech recognition error', event.error);
    micButton.textContent = '🎤';
  });
} else {
  micButton.disabled = true;
  micButton.title = "Speech recognition not supported in this browser";
}
</script>
</body>
</html>
